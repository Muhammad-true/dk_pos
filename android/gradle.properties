# ПК с ~8 ГБ ОЗУ: меньше heap → больше места под native (см. hs_err_pid*.log).
# HeapBaseMinAddress — меньше конфликт compressed oops с native (hs_err_pid*.log).
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:HeapBaseMinAddress=2g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx256m
android.useAndroidX=true
android.enableJetifier=true
