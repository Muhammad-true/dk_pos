# ПК с ~8 ГБ ОЗУ: умеренный heap; Metaspace 512m — иначе assembleRelease падает (Gradle daemon Metaspace OOM).
# HeapBaseMinAddress — меньше конфликт compressed oops с native (hs_err_pid*.log).
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=96m -XX:HeapBaseMinAddress=2g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx384m
android.useAndroidX=true
# Jetifier на io.flutter:*_debug jar даёт Java heap space OOM; зависимости уже на AndroidX.
android.enableJetifier=false
